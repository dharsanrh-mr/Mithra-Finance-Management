<script src="app.js"></script>

<script>
/* Mithra resilient boot guard — does not alter existing data or page design. */
(function(){
  function bootCheck(){
    var p=document.getElementById('page');
    if(!p) return;
    if(!p.innerHTML || !p.innerHTML.trim()){
      try{
        if(typeof window.render==='function'){
          window.render('dashboard');
        }
      }catch(err){
        p.innerHTML='<div class="card error-card"><h2>Mithra Finance System could not load</h2><p>The dashboard hit a runtime error. Reload the page once.</p><pre style="white-space:pre-wrap;overflow:auto">'+String(err&&err.message||err)+'</pre><button class="btn green" onclick="location.reload()">Reload</button></div>';
        console.error('Mithra boot error:',err);
      }
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(bootCheck,80);});
  else setTimeout(bootCheck,80);
})();
</script>
